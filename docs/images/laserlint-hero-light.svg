<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" role="img" aria-labelledby="t d"><title id="t">laserlint checks an SVG before you burn it</title><desc id="d">A coaster design goes into laserlint, which reports each check by name: a problem for lines too close, warnings for a crossing, a small detail, density and a white background, OK for line art, and the verdict: not ready to burn.</desc><rect width="880" height="330" rx="16" fill="#FAFAF7"/><rect x="24" y="40" width="250" height="250" rx="12" fill="#FFFFFF" stroke="#D5D8DC"/><text x="44" y="70" font-family="'JetBrains Mono', SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#59636E">coaster.svg</text><g fill="none" stroke="#16181D" stroke-width="1.6" stroke-linecap="round"><circle cx="149" cy="175" r="92"/><circle cx="149" cy="175" r="87"/><path d="M98 150 q25 -10 51 0 t51 0"/><path d="M98 155 q25 -10 51 0 t51 0"/><path d="M98 160 q25 -10 51 0 t51 0"/><path d="M98 165 q25 -10 51 0 t51 0"/><path d="M98 170 q25 -10 51 0 t51 0"/><path d="M98 175 q25 -10 51 0 t51 0"/><path d="M98 180 q25 -10 51 0 t51 0"/><path d="M104 196 L194 238 M104 238 L194 196"/></g><circle cx="149" cy="112" r="2.5" fill="#16181D"/><path d="M290 165 H330" stroke="#59636E" stroke-width="2" stroke-linecap="round"/><path d="M324 159 L332 165 L324 171" fill="none" stroke="#59636E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(348 118) scale(1.35)"><path d="M42.4 15.4 C41.6 11.2 38.8 8.4 35.2 7.8 C36.6 9.4 37 10.8 36.8 12 C35.2 9.8 32.4 8.9 29.6 9.7 C31.2 10.9 31.9 12.3 31.8 13.5 C30.7 13 29.3 13.1 28.2 14.1 C29.8 14.5 30.6 15.3 30.9 16.4 Q36.4 13 42.4 15.4 Z" fill="#E8472B"/><path fill-rule="evenodd" fill="#16181D" d="M47.8 21.8 C46.5 15 40 12.5 34.5 13.5 C29 14.5 26 18.5 24 23 C21 29 17 33 12.5 37 L4 41.5 L7 43.2 L4.5 45.5 L14 42.5 C17 46 23 49 31 48.5 C40 48 46.5 42 47.5 34 C47.8 31 48 29 47.9 26.2 L53.5 24.3 Z M44.5 22 A3 3 0 1 0 38.5 22 A3 3 0 1 0 44.5 22 Z"/></g><text x="386" y="222" font-family="Outfit, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#16181D">laserlint</text><path d="M442 165 H482" stroke="#59636E" stroke-width="2" stroke-linecap="round"/><path d="M476 159 L484 165 L476 171" fill="none" stroke="#59636E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="498" y="40" width="358" height="250" rx="12" fill="#FFFFFF" stroke="#D5D8DC"/><text x="518" y="80" font-family="'JetBrains Mono', SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="700" fill="#C4381E">PROBLEM</text><text x="600" y="80" font-family="'JetBrains Mono', SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#16181D">Lines too close</text><text x="836" y="80" font-family="'JetBrains Mono', SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="14" text-anchor="end" fill="#59636E">38.7%</text><text x="518" y="110" font-family="'JetBrains Mono', SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="700" fill="#9A6700">WARNING</text><text x="600" y="110" font-family="'JetBrains Mono', SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#16181D">Crossings</text><text x="836" y="110" font-family="'JetBrains Mono', SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="14" text-anchor="end" fill="#59636E">1</text><text x="518" y="140" font-family="'JetBrains Mono', SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="700" fill="#9A6700">WARNING</text><text x="600" y="140" font-family="'JetBrains Mono', SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#16181D">Small details</text><text x="836" y="140" font-family="'JetBrains Mono', SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="14" text-anchor="end" fill="#59636E">1</text><text