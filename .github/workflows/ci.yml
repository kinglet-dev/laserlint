name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Tests with race detector and coverage
        run: go tool ginkgo -r --race --cover --coverprofile=coverage.out
      - name: Require 100% coverage
        run: scripts/check-coverage.sh coverage.out

  checks:
    name: Formatting, supply chain and fuzzing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "Run gofmt -w on the files above."; exit 1; }
      - name: go.sum matches the Go checksum database
        # Rebuilds go.sum from scratch, verified against sum.golang.org, and compares.
        run: |
          mv go.sum go.sum.committed
          go mod tidy
          diff -u go.sum.committed go.sum
      - name: Known vulnerabilities (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Fuzz parsers (30 s each)
        run: |
          go test ./domain/units -run '^$' -fuzz=FuzzParseLength -fuzztime=30s
          go test ./adapters/svg/pathdata -run '^$' -fuzz=FuzzParse -fuzztime=30s
