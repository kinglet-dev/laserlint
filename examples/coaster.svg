    <path d="M16 26.1 q7 -3 14 0 t14 0"/>
    <path d="M16 26.4 q7 -3 14 0 t14 0"/>
    <path d="M16 26.7 q7 -3 14 0 t14 0"/>
    <path d="M16 27.0 q7 -3 14 0 t14 0"/>
